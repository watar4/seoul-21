<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local animation checks</title><style>body{font:16px system-ui;background:#102b21;color:#fff;padding:20px}button{font:inherit;margin:7px;padding:12px}p{line-height:1.7}</style><h1>Animation scenarios</h1><p>開発用。選んだ手札で、ローカルの練習データを初期化します。配札後、指定の行動で演出を確認。</p><div id="scenarios"></div><script type="module">
import {fresh,DEFAULT_RULES} from '../engine.js';
const cases=[['WIN / スタンド',[10,6,8,10,10]],['LOSE / スタンド',[10,10,8,9]],['PUSH / スタンド',[10,10,8,8]],['BLACKJACK',['A',9,'K',8]],['DOUBLE / ダブル',[5,6,6,10,10,10]],['SPLIT / スプリット',['A',6,'A',10,10,10,10]],['HIT / ヒット',[3,6,4,10,2,10]],['SURRENDER / サレンダー',[10,10,6,7]],['ENHC / ダブル',[5,10,6,10,'A'],{mode:'enhc'}]];
for(const [label,ranks,rules={}] of cases){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{const state=fresh(1000,{...DEFAULT_RULES,...rules}),suits=['♠','♥','♣','♦'];state.shoe=[...Array.from({length:100},()=>({rank:'10',suit:'♠'})),...ranks.map((rank,i)=>({rank:String(rank),suit:suits[i%4]})).reverse()];localStorage.setItem('seoul21.state.v1',JSON.stringify(state));localStorage.setItem('seoul21.review','on');localStorage.setItem('seoul21.signal','on');location.href='../index.html';};document.querySelector('#scenarios').append(b);}
</script></html>
